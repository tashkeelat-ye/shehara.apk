name: Build شهارة Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Capacitor Android setup
        run: |
          if [ ! -d "android" ]; then
            echo "لا يوجد مجلد android بعد، سيتم إنشاؤه الآن..."
            npx cap add android
          else
            echo "مجلد android موجود مسبقًا، سيتم استخدامه كما هو."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure portrait orientation
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android:screenOrientation="portrait"' "$MANIFEST"; then
            echo "الاتجاه Portrait مضبوط مسبقًا."
          else
            sed -i 's/<activity/<activity\n            android:screenOrientation="portrait"/' "$MANIFEST"
            echo "تم ضبط الاتجاه Portrait."
          fi
          grep "screenOrientation" "$MANIFEST"

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ فشل: لم يتم العثور على APK في $APK_PATH"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "✅ تم العثور على APK."

      - name: Show APK path, size, and SHA-256
        run: |
          echo "== مسار الـ APK =="
          echo "$APK_PATH"
          echo "== حجم الـ APK =="
          ls -lh "$APK_PATH"
          echo "== SHA-256 =="
          sha256sum "$APK_PATH"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shehara-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
