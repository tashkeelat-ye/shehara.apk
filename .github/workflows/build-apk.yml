name: Build شهارة Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix package.json Invalid Version
        run: |
          # يقوم هذا الأمر بحذف السطر المسبب للمشكلة تماماً من ملف الإعدادات لتجاوز خطأ التحميل
          sed -i '/"@capacitor\/app"/d' package.json
          cat package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Project
        run: npm run build --if-present

      - name: Add Android platform (Capacitor)
        run: |
          npm install @capacitor/app@latest --save-beta || npm install @capacitor/app@6.0.0
          npx cap add android || true

      - name: Force portrait orientation
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's#<activity#<activity\n            android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          fi

      - name: Generate app icons & splash
        run: |
          npm install -g @capacitor/assets
          npx capacitor-assets generate --android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Compute SHA-256
        run: |
          APK=$(find android -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shehara-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          
